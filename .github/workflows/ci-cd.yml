name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI - Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Install Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Compile, test, and package
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Save packaged JAR
        uses: actions/upload-artifact@v7
        with:
          name: task-manager-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  delivery:
    name: CD - Publish container image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Download packaged JAR
        uses: actions/download-artifact@v8
        with:
          name: task-manager-jar
          path: target

      - name: Create lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        shell: bash
        run: |
          docker build             --tag "$IMAGE_NAME:${GITHUB_SHA}"             --tag "$IMAGE_NAME:latest"             .
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"
